name: Flutter app

# Builds Trendlix People, the employee app in Flutter (apps/flutter, README Phase 0; owner, 30 October 2026: "lets start
# in the flutter one"), as an Android APK the owner downloads and installs to try each phase. It takes the old app's
# place (apps/mobile, "Replace it now"): the same Android identity (com.trendlix.people) and a higher version code. Each
# build is signed with the app's one key (below) and its release says since which version that key is the same, so the
# app's update asks to remove the old version first only when the phone's build has another key.
#
# Runs on a push to main that touches apps/flutter or this file, and by hand ("Run workflow" on the Actions page). It
# does not watch the API, the web app or apps/mobile, and backend.yml does not watch apps/flutter.
#
# Where the APK is: Actions -> the run -> Artifacts -> trendlix-people-<version> (a .zip with the .apk inside), kept
# 30 days. A push to main also publishes it as a GitHub release (tag app-<version>, the file trendlix-people.apk): the
# app's force update (owner, 31 October 2026: "Always the latest build", "A fixed People link") asks People for the newest
# one (GET /api/app/latest), and people.trendlix.com/download sends everyone to it. The version: versionCode = 1000 + the run number (the old app's builds stopped at 11, so every Flutter build
# is newer), versionName = <major.minor of apps/flutter/pubspec.yaml>.<run> (e.g. 0.2.3).
#
# Google Play (owner, 6 November 2026: "now i have google play console"; asked, "Employees only", "Play only"): once the
# secrets PLAY_UPLOAD_KEYSTORE_BASE64 and PLAY_UPLOAD_PASSWORD are set (the upload key, ~/TrendLIX-Play-Upload-Key on the
# owner's Mac), each build is an app bundle for Play (trendlix-people-<version>.aab in the run's Artifacts, uploaded to
# the Play Console's closed testing track), built with PEOPLE_STORE=play so the app takes its updates from Play. Its
# release here is a pre-release, which People's app/latest ignores, so the phones on the website's APK aren't moved
# before Play has the app. Once the app is live on Play, "Run workflow" with "Google Play is live" ticked makes the newest
# Play build the latest release: People then tells those phones to remove their version and get the app from Play
# (app-releases.ts), and the website's /download goes to Play.
#
# The iPhone app (owner, 7 November 2026: "my apple developer account is ready"; asked, "Unlisted App Store page"): the job
# "iphone" builds it on a Mac once the checks passed, with the same version; see the job.

on:
  push:
    branches: [main]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter-android.yml'
  workflow_dispatch:
    inputs:
      play_live:
        description: 'Google Play is live: move the phones on the website APK to Play (no build)'
        type: boolean
        default: false

# write: the release each build is published as
permissions:
  contents: write

# a newer push replaces a build still running for the same branch
concurrency:
  group: flutter-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build the app
    if: ${{ !inputs.play_live }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the version, for the iPhone build
    outputs:
      version: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    env:
      HAS_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
      # a build for Google Play once its upload key is set (6 November 2026)
      PLAY: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 != '' && secrets.PLAY_UPLOAD_PASSWORD != '' }}
      # uploaded to Google Play by itself once its service account is set (6 November 2026)
      HAS_PLAY_UPLOADER: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v7

      # the SDK pinned to the version on the owner's Mac (README §1), its download kept between runs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # Gradle's downloads (the wrapper, the Android plugin, AndroidX) are kept between runs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            apps/flutter/android/*.gradle*
            apps/flutter/android/app/*.gradle*
            apps/flutter/android/gradle/wrapper/gradle-wrapper.properties
            apps/flutter/pubspec.lock

      # the runner's Android SDK, with its licences accepted; Gradle fetches any platform, build tools or NDK still missing
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Packages (as the lock file pins them)
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The app's one signing key, so each APK installs over the last (a phone refuses an update signed with another
      # key; owner, 2 November 2026: "if it is not applicable skip it", the app's step to remove the old version first).
      # From the secret ANDROID_DEBUG_KEYSTORE_BASE64 when it is set; else the keystore kept in the Actions cache (GitHub
      # drops it after 7 days without a build); else one made now and kept from then on. Builds before 2 November 2026
      # each had a key of their own: the cache of ~/.android/debug.keystore was never saved, Gradle's key being elsewhere.
      # The build signs with it through PEOPLE_KEYSTORE (android/app/build.gradle.kts). A debug keystore's passwords.
      - name: Signing key from the cache
        if: env.PLAY != 'true' && env.HAS_DEBUG_KEYSTORE != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.people-signing/people.keystore
          key: people-signing-keystore-v1

      - name: Signing key from the secret
        if: env.PLAY != 'true' && env.HAS_DEBUG_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.people-signing
          printf '%s' "$KEYSTORE" | base64 -d > ~/.people-signing/people.keystore

      - name: Signing key
        if: env.PLAY != 'true'
        run: |
          mkdir -p ~/.people-signing
          if [ ! -s ~/.people-signing/people.keystore ]; then
            keytool -genkeypair -keystore ~/.people-signing/people.keystore -storetype PKCS12 \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Trendlix People, O=Trendlix, C=EG"
            echo "::warning::A new signing key was made: this APK doesn't install over the last one, so the app says to remove the old version first (once)."
          fi
          echo "PEOPLE_KEYSTORE=$HOME/.people-signing/people.keystore" >> "$GITHUB_ENV"

      # Google Play's upload key (PKCS12, alias "upload"): Play checks the bundle with it and signs the app with its own
      # key (android/app/build.gradle.kts). The password stays in the build step's environment.
      - name: Play upload key
        if: env.PLAY == 'true'
        env:
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.p12"
          echo "PLAY_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"

      - name: Version
        id: version
        run: |
          code=$((1000 + GITHUB_RUN_NUMBER))
          base="$(sed -n 's/^version: *\([0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)"
          if [ -z "$base" ]; then
            echo "::error::apps/flutter/pubspec.yaml has no version like 0.2.0+1."
            exit 1
          fi
          name="$base.$GITHUB_RUN_NUMBER"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $name (code $code)"

      # Push notifications (owner, 8 November 2026: "gives a push notification once requested"): the Firebase project's
      # settings for com.trendlix.people from the secret GOOGLE_SERVICES_JSON (the old app's, 20 October 2026), written as
      # the app's resources (git ignores them) so Android starts Firebase itself, and PEOPLE_PUSH=on for the app.
      # Without the secret: built without push (a notice), the bell and the popups as ever.
      - name: Firebase for push notifications
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 tool/firebase_config.py android

      # Where the app finds People (lib/config.dart): the live address, and the root of the server's private authority
      # (and its build stamp: version, code, commit and time, shown in the app's About this app)
      # (deploy/ca-cert.sh) from the repository variable API_CA_CERT (the one backend.yml checks). Without it the app can't
      # reach People, so the build stops. A release build (fast and small), signed with the key above.
      - name: Build
        env:
          API_CA_CERT: ${{ vars.API_CA_CERT }}
          PLAY_UPLOAD_PASSWORD: ${{ secrets.PLAY_UPLOAD_PASSWORD }}
        run: |
          if [ -z "$API_CA_CERT" ]; then
            echo "::error::The repository variable API_CA_CERT is not set (deploy/ca-cert.sh prints it): without it the app can't reach People."
            exit 1
          fi
          # for Google Play: an app bundle, taking its updates from Play (PEOPLE_STORE=play); else the website's APK
          if [ "$PLAY" = "true" ]; then kind=appbundle; store=play; else kind=apk; store=; fi
          flutter build "$kind" --release \
            --dart-define=PEOPLE_STORE="$store" \
            --dart-define=PEOPLE_PUSH="${PEOPLE_PUSH:-}" \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$APP_VERSION_CODE" \
            --dart-define=PEOPLE_API_URL=https://srv2055591.hstgr.cloud:8443 \
            --dart-define=PEOPLE_API_CA="$API_CA_CERT" \
            --dart-define=PEOPLE_APP_VERSION="$APP_VERSION_NAME" \
            --dart-define=PEOPLE_APP_BUILD="$APP_VERSION_CODE" \
            --dart-define=PEOPLE_APP_COMMIT="${GITHUB_SHA:0:7}" \
            --dart-define=PEOPLE_APP_BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Name the APK
        id: apk
        if: env.PLAY != 'true'
        run: |
          src=build/app/outputs/flutter-apk/app-release.apk
          dest="$RUNNER_TEMP/trendlix-people-$APP_VERSION_NAME.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          # the signing certificate's fingerprint: the same as the last build's means it installs over it
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          cert="$("$tools/apksigner" verify --print-certs "$dest" 2>/dev/null | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          echo "APP_SIGNING_CERT=$cert" >> "$GITHUB_ENV"
          {
            echo "### Trendlix People $APP_VERSION_NAME (Flutter)"
            echo ""
            echo "- APK, version code $APP_VERSION_CODE, $(du -h "$dest" | cut -f1)"
            echo "- APK SHA-256 \`$(sha256sum "$dest" | cut -d' ' -f1)\`"
            echo "- Signing certificate SHA-256 \`${cert:-unknown}\`"
            echo "- Install: Artifacts below -> trendlix-people-$APP_VERSION_NAME -> unzip -> open the .apk on the phone"
          } >> "$GITHUB_STEP_SUMMARY"

      # the bundle for the Play Console, and its upload certificate's fingerprint (the Console shows the one it expects)
      - name: Name the bundle
        id: aab
        if: env.PLAY == 'true'
        run: |
          dest="$RUNNER_TEMP/trendlix-people-$APP_VERSION_NAME.aab"
          cp build/app/outputs/bundle/release/app-release.aab "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          cert="$(keytool -printcert -jarfile "$dest" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          if [ -z "$cert" ]; then
            echo "::error::The bundle isn't signed with the upload key: check the secrets PLAY_UPLOAD_KEYSTORE_BASE64 and PLAY_UPLOAD_PASSWORD."
            exit 1
          fi
          {
            echo "### Trendlix People $APP_VERSION_NAME for Google Play"
            echo ""
            echo "- App bundle, version code $APP_VERSION_CODE, $(du -h "$dest" | cut -f1)"
            echo "- Upload certificate SHA-256 \`$cert\`"
            echo "- Upload: Artifacts below -> trendlix-people-$APP_VERSION_NAME -> unzip -> the .aab to the Play Console (Testing -> Closed testing -> Create new release)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: trendlix-people-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path || steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # The newest build for everyone (the app's force update, update_gate.dart): a release tagged app-<version> on this
      # commit, its file always named trendlix-people.apk, so the website's /download (releases/latest/download/…)
      # always finds it. Only from main; a build by hand of another branch stays in the run's artifacts.
      - name: Publish the release
        if: github.ref == 'refs/heads/main' && env.PLAY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp "$APK" "$RUNNER_TEMP/release/trendlix-people.apk"
          # a run tried again has the same version: its release gets the new file
          if gh release view "app-$APP_VERSION_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "app-$APP_VERSION_NAME" "$RUNNER_TEMP/release/trendlix-people.apk" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          # Since which version the signing key is the same (People's app/latest reads the line, app-releases.ts): a phone
          # on it or later updates in place, an older one is told to remove its version first. The same key as the
          # newest release: since that release's own "since" (or that release, when it doesn't say); else this one.
          prev="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
          since="app-$APP_VERSION_NAME"
          if [ -n "$prev" ] && [ -n "$APP_SIGNING_CERT" ] && gh release download "$prev" --repo "$GITHUB_REPOSITORY" -p trendlix-people.apk -D "$RUNNER_TEMP/previous" >/dev/null 2>&1; then
            tools="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)"
            before="$("$tools/apksigner" verify --print-certs "$RUNNER_TEMP/previous/trendlix-people.apk" 2>/dev/null | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
            if [ "$before" = "$APP_SIGNING_CERT" ]; then
              earlier="$(gh release view "$prev" --repo "$GITHUB_REPOSITORY" --json body -q .body | sed -n 's/^Same signing key since \(app-[0-9.]*\).*/\1/p' | head -1)"
              since="${earlier:-$prev}"
            fi
          fi
          echo "- Same signing key since $since (the last release: ${prev:-none})" >> "$GITHUB_STEP_SUMMARY"
          notes="$(printf '%s\n\n%s\n%s\n' \
            "The employee app, version $APP_VERSION_NAME (code $APP_VERSION_CODE). Install: open the .apk on the phone." \
            "Signing certificate SHA-256: ${APP_SIGNING_CERT:-unknown}" \
            "Same signing key since $since")"
          gh release create "app-$APP_VERSION_NAME" "$RUNNER_TEMP/release/trendlix-people.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Trendlix People $APP_VERSION_NAME" \
            --notes "$notes" \
            --latest
          echo "- Released: https://github.com/$GITHUB_REPOSITORY/releases/tag/app-$APP_VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"

      # A Play build's release: a pre-release (app/latest ignores it), its bundle attached, saying it is one and since
      # which version Play's key is the same (the first Play build's), so the phones on an older, website-signed build are
      # told to remove it first once it is made the latest ("Google Play is live" below).
      - name: Publish the Play build
        if: github.ref == 'refs/heads/main' && env.PLAY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AAB: ${{ steps.aab.outputs.path }}
        run: |
          if gh release view "app-$APP_VERSION_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "app-$APP_VERSION_NAME" "$AAB" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          since=""
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName -q '.[].tagName'); do
            body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
            if printf '%s' "$body" | grep -q '^Google Play build'; then
              since="$(printf '%s' "$body" | sed -n 's/^Same signing key since \(app-[0-9.]*\).*/\1/p' | head -1)"
              break
            fi
          done
          since="${since:-app-$APP_VERSION_NAME}"
          notes="$(printf '%s\n\n%s\n%s\n' \
            "The employee app, version $APP_VERSION_NAME (code $APP_VERSION_CODE), for Google Play." \
            "Google Play build" \
            "Same signing key since $since")"
          gh release create "app-$APP_VERSION_NAME" "$AAB" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Trendlix People $APP_VERSION_NAME (Google Play)" \
            --notes "$notes" \
            --prerelease
          echo "- Pre-released (Google Play build, same key since $since): https://github.com/$GITHUB_REPOSITORY/releases/tag/app-$APP_VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"

      # Straight to Google Play's closed testing (owner, 6 November 2026: "will i upload it manually?"): once the secret
      # PLAY_SERVICE_ACCOUNT_JSON is set (a Google Cloud service account, with the Google Play Android Developer API on,
      # invited in the Play Console with "Release to testing tracks": docs/google-play.md), each Play build from main goes
      # to the track PLAY_TRACK (a repository variable; Play's first closed track, "alpha", when unset), rolled out to its
      # testers once Google has reviewed it. The app's first release is uploaded by hand: Google's API can't make it.
      - name: Upload to Google Play
        if: github.ref == 'refs/heads/main' && env.PLAY == 'true' && env.HAS_PLAY_UPLOADER == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.trendlix.people
          releaseFiles: ${{ steps.aab.outputs.path }}
          releaseName: ${{ steps.version.outputs.name }}
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: completed

  # The iPhone app (owner, 7 November 2026: "my apple developer account is ready"; asked, "Unlisted App Store page", and
  # the location while checked in "Not for now"), built on a Mac (Xcode 26, as Apple requires) once the checks above
  # passed, with the Android build's version. Once the secret APPLE_SIGNING_BASE64 is set (apps/flutter/tool/
  # apple_signing.py makes it: the Apple Distribution certificate, the App Store profile and the App Store Connect API key;
  # docs/app-store.md), each build from main is signed for the App Store and uploaded to App Store Connect, where it shows
  # under TestFlight and is sent for review by hand. Without the secret it is built unsigned, only to check it still builds.
  iphone:
    name: Build the iPhone app
    needs: build
    # iPhone builds held (owner, 10 November 2026: "hold pushing any new build till the app store approval", then "can we
    # push the android only?"): Android only until Apple approves the build in review; then remove this line and set
    # APP_STORE_UPLOADS on
    if: false
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SIGNED: ${{ secrets.APPLE_SIGNING_BASE64 != '' }}
      # App Store Connect uploads paused (owner, 10 November 2026: "dont push anything to the app store now, i need to
      # pass the current build first"): the iPhone app is still built and signed, never uploaded, until this says on
      APP_STORE_UPLOADS: paused
      APP_VERSION_NAME: ${{ needs.build.outputs.version }}
      APP_VERSION_CODE: ${{ needs.build.outputs.code }}
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Packages (as the lock file pins them)
        run: flutter pub get --enforce-lockfile

      # The secret is a .tar.gz (apple_signing.py): cert.p12 (the certificate and its key), profile.mobileprovision,
      # AuthKey.p8 (the API key the upload signs in with) and signing.env (the IDs and the certificate's password). The
      # certificate goes to a keychain of its own, the profile where Xcode looks, and the Runner target's Release signing
      # to ios/Flutter/Signing.xcconfig (Release.xcconfig includes it; git ignores it).
      - name: App Store signing
        if: env.SIGNED == 'true'
        env:
          APPLE_SIGNING: ${{ secrets.APPLE_SIGNING_BASE64 }}
        run: |
          dir="$RUNNER_TEMP/apple"
          mkdir -p "$dir"
          printf '%s' "$APPLE_SIGNING" | base64 --decode | tar -xz -C "$dir"
          value() { sed -n "s/^$1=//p" "$dir/signing.env" | head -1; }
          password="$(value P12_PASSWORD)"
          echo "::add-mask::$password"
          team="$(value TEAM_ID)"
          profile_name="$(value PROFILE_NAME)"
          bundle="$(value BUNDLE_ID)"
          key_id="$(value KEY_ID)"
          if [ -z "$team" ] || [ -z "$profile_name" ] || [ -z "$key_id" ] || [ ! -s "$dir/cert.p12" ]; then
            echo "::error::The secret APPLE_SIGNING_BASE64 isn't what apple_signing.py writes: paste github-secret-APPLE_SIGNING_BASE64.txt again."
            exit 1
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$dir/cert.p12" -P "$password" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # the profile as Apple has it now (tool/apple_profile.py: made again with Push Notifications on 8 November 2026),
          # else the one in the secret
          if ! python3 tool/apple_profile.py fetch --key-id "$key_id" --issuer-id "$(value ISSUER_ID)" --key "$dir/AuthKey.p8" --out "$dir/profile.mobileprovision"; then
            echo "::warning title=Profile from the secret::Apple's current profile couldn't be read: the one in APPLE_SIGNING_BASE64 is used."
          fi
          uuid="$(security cms -D -i "$dir/profile.mobileprovision" | plutil -extract UUID raw -)"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$dir/profile.mobileprovision" "$d/$uuid.mobileprovision"
          done

          cat > ios/Flutter/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $team
          PROVISIONING_PROFILE_SPECIFIER = $profile_name
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          EOF
          # push notifications (8 November 2026): the app asks for them only once the profile has Push Notifications
          # (tool/apple_profile.py push); else it signs as before
          if security cms -D -i "$dir/profile.mobileprovision" | plutil -extract Entitlements.aps-environment raw - >/dev/null 2>&1; then
            echo "CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements" >> ios/Flutter/Signing.xcconfig
            echo "- Push Notifications: in the profile" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=No push on iPhone yet::The App Store profile has no Push Notifications: run apps/flutter/tool/apple_profile.py push (docs/app-store.md)."
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$team</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$bundle</key><string>$profile_name</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          # where altool finds the API key
          mkdir -p "$HOME/private_keys"
          cp "$dir/AuthKey.p8" "$HOME/private_keys/AuthKey_$key_id.p8"
          echo "APPLE_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "APPLE_ISSUER_ID=$(value ISSUER_ID)" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "- Signed for the App Store: team $team, profile \"$profile_name\" (certificate until $(value CERT_EXPIRES))" >> "$GITHUB_STEP_SUMMARY"

      # Push notifications (8 November 2026): the Firebase project's settings for the Apple app com.trendlix.people from
      # the secret GOOGLE_SERVICE_INFO_PLIST (docs/app-store.md), given to the app; without it, no push on iPhone.
      - name: Firebase for push notifications
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: python3 tool/firebase_config.py ios

      # The same settings as the Android build (lib/config.dart). Signed: the .ipa for App Store Connect; else an unsigned
      # build, only to check it compiles.
      - name: Build
        env:
          API_CA_CERT: ${{ vars.API_CA_CERT }}
        run: |
          if [ -z "$API_CA_CERT" ]; then
            echo "::error::The repository variable API_CA_CERT is not set (deploy/ca-cert.sh prints it): without it the app can't reach People."
            exit 1
          fi
          args=(
            --release
            --build-name="$APP_VERSION_NAME"
            --build-number="$APP_VERSION_CODE"
            --dart-define=PEOPLE_API_URL=https://srv2055591.hstgr.cloud:8443
            --dart-define=PEOPLE_API_CA="$API_CA_CERT"
            --dart-define=PEOPLE_APP_VERSION="$APP_VERSION_NAME"
            --dart-define=PEOPLE_APP_BUILD="$APP_VERSION_CODE"
            --dart-define=PEOPLE_APP_COMMIT="${GITHUB_SHA:0:7}"
            --dart-define=PEOPLE_APP_BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --dart-define=FIREBASE_IOS_API_KEY="${FIREBASE_IOS_API_KEY:-}"
            --dart-define=FIREBASE_IOS_APP_ID="${FIREBASE_IOS_APP_ID:-}"
            --dart-define=FIREBASE_IOS_SENDER_ID="${FIREBASE_IOS_SENDER_ID:-}"
            --dart-define=FIREBASE_IOS_PROJECT_ID="${FIREBASE_IOS_PROJECT_ID:-}"
          )
          if [ "$SIGNED" = "true" ]; then
            flutter build ipa "${args[@]}" --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
            ipa="$(ls build/ios/ipa/*.ipa | head -1)"
            echo "IPA=$PWD/$ipa" >> "$GITHUB_ENV"
            echo "### Trendlix People $APP_VERSION_NAME for iPhone (build $APP_VERSION_CODE, $(du -h "$ipa" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            flutter build ios "${args[@]}" --no-codesign
            echo "### Trendlix People $APP_VERSION_NAME for iPhone: built unsigned (set the secret APPLE_SIGNING_BASE64 to sign and upload it, docs/app-store.md)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # To App Store Connect (TestFlight), signed in with the API key. Apple checks the build for some minutes; then it
      # can be tried on TestFlight and chosen for the App Store version sent for review (docs/app-store.md).
      - name: Upload to App Store Connect
        if: github.ref == 'refs/heads/main' && env.SIGNED == 'true' && env.APP_STORE_UPLOADS == 'on'
        run: |
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$APPLE_KEY_ID" --apiIssuer "$APPLE_ISSUER_ID"
          echo "- Uploaded to App Store Connect: TestFlight shows it once Apple has processed it" >> "$GITHUB_STEP_SUMMARY"

      - name: App Store Connect uploads paused
        if: github.ref == 'refs/heads/main' && env.SIGNED == 'true' && env.APP_STORE_UPLOADS != 'on'
        run: |
          echo "- Not uploaded: App Store Connect uploads are paused (APP_STORE_UPLOADS in the workflow)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing
        if: always() && env.SIGNED == 'true'
        run: |
          [ -n "$SIGNING_KEYCHAIN" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/apple" ios/Flutter/Signing.xcconfig

  # "Google Play is live" (Run workflow by hand, the box ticked): the newest Play build becomes the latest release, so People
  # tells the phones still on the website's APK to remove it and get the app from Play, and /download goes to Play.
  play-live:
    name: Google Play is live
    if: ${{ inputs.play_live }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Make the newest Play build the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName -q '.[].tagName'); do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body -q .body | grep -q '^Google Play build'; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
              echo "### $tag is the latest release: the phones on the website's APK are sent to Google Play" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::No Google Play build is released yet: push a build with the Play upload key set first."
          exit 1
