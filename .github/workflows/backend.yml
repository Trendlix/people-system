name: Deploy backend

# Brings People System's API on the server up to date, the same way Prime ERP's pipeline does. On every push to main
# that touches the backend (apps/api, packages/shared, services, deploy, or the lock file), this signs in to the server
# with a key that can do one thing there, run deploy/deploy.sh: fetch, save the database, build the images of the API
# and the OCR service, restart, and wait until they answer. Then it asks the API itself whether it is up. "Run
# workflow" on the Actions page does the same by hand.
#
# Nothing else is done here: no tests are run. The tests are run before a push. The web app is built by Vercel from
# the same push.
#
# What it needs, set once in the repository's settings (Secrets and variables, Actions):
#   secret VPS_SSH_KEY       the private key made on the server by deploy/ci-key.sh
#   secret VPS_KNOWN_HOSTS   the server's own host key, printed by the same script
#   variable API_CA_CERT     the root certificate of the API's private authority, printed by deploy/ca-cert.sh
#   variables VPS_HOST, VPS_USER, API_URL   only if they differ from the ones written below

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'services/**'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions: {}

# one at a time: a deploy is never started while another is still building on the server
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Run deploy.sh on the server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HOST: ${{ vars.VPS_HOST || 'srv2055591.hstgr.cloud' }}
      USER_NAME: ${{ vars.VPS_USER || 'root' }}
      API_URL: ${{ vars.API_URL || 'https://srv2055591.hstgr.cloud:8443' }}
    steps:
      - name: Run deploy/deploy.sh
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KNOWN" ]; then
            echo "::error::The secrets VPS_SSH_KEY and VPS_KNOWN_HOSTS are not set. Run deploy/ci-key.sh on the server and save what it prints as the two secrets."
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          # the key is tied on the server to deploy.sh: whatever is asked for here, that script is what runs
          # a long build keeps the connection open: 30 s keep-alives, given up only after 10 unanswered (5 minutes); a
          # dropped connection (ssh's exit 255, 21 October 2026) is tried again, deploy.sh being safe to run again: twice
          # more, after 1 and then 3 minutes (22 October 2026: it dropped twice in a row a minute apart)
          run_deploy() { ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$USER_NAME@$HOST" deploy; }
          set +e
          run_deploy
          code=$?
          for wait in 60 180; do
            [ "$code" -eq 255 ] || break
            echo "::warning::The connection to the server dropped (ssh exit 255); trying the deploy again in $wait seconds."
            sleep "$wait"
            run_deploy
            code=$?
          done
          set -e
          [ "$code" -eq 0 ] || exit "$code"
          rm -f ~/.ssh/deploy
      # the API's certificate comes from its own private authority (deploy/Caddyfile): curl trusts exactly that one
      - name: Trust the API's certificate
        env:
          CA: ${{ vars.API_CA_CERT }}
        run: |
          if [ -z "$CA" ]; then
            echo "::error::The variable API_CA_CERT is not set. Run deploy/ca-cert.sh on the server and save what it prints as a repository variable."
            exit 1
          fi
          printf '%s' "$CA" | base64 -d > "$RUNNER_TEMP/api-ca.crt"
          echo "CURL_CA_BUNDLE=$RUNNER_TEMP/api-ca.crt" >> "$GITHUB_ENV"
      - name: The API answers
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$API_URL/api/health" | tee /dev/stderr | grep -q '"ok"'
      - name: The commit the server runs
        run: |
          curl -fsS "$API_URL/api/version"
