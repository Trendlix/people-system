<!doctype html>
<!--
  The app's own start page. While capacitor.config.ts sets server.url, the app opens the website directly and this
  page is never shown; it is kept because Capacitor needs an index.html in www, and so that a build without server.url
  still lands on the site.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TrendLIX People</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #f4f5f7; color: #5b6472;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .spinner {
        width: 32px; height: 32px; border-radius: 50%;
        border: 3px solid #e3e6eb; border-top-color: #2b59f0;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div class="spinner" role="status" aria-label="Opening TrendLIX People"></div>
    <script>
      window.location.replace('https://people.trendlix.com/app');
    </script>
  </body>
</html>
