<!doctype html>
<!--
  Shown from the app's own files (capacitor.config.ts, server.errorPath) when the website can't be reached: no
  connection, the site down, or an error on the page itself. On Android this page has no Capacitor plugins, so it uses
  only the browser's own APIs. Retry checks the site answers before opening it, so a tap without a connection keeps
  this page instead of flashing a blank one; when the phone comes back online it tries by itself.
  The text is kept here (not in native code) so it can be translated with the pages later.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TrendLIX People</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        box-sizing: border-box; padding: 24px 16px;
        background: #f4f5f7; color: #12161f;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%; max-width: 360px; text-align: center;
        background: #ffffff; border: 1px solid #e3e6eb; border-radius: 12px; padding: 32px 24px;
      }
      .icon { width: 48px; height: 48px; margin: 0 auto 16px; color: #5b6472; }
      h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; }
      p { margin: 0 0 24px; color: #5b6472; }
      button {
        display: inline-flex; align-items: center; justify-content: center;
        width: 100%; min-height: 48px; border: 0; border-radius: 8px;
        background: #2b59f0; color: #ffffff; font: inherit; font-weight: 600;
        cursor: pointer;
      }
      button:active { background: #1f47d1; }
      button:disabled { opacity: 0.6; cursor: default; }
      button:focus-visible { outline: 3px solid rgba(43, 89, 240, 0.35); outline-offset: 2px; }
      .status { min-height: 1.5em; margin: 12px 0 0; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M2 8.8a15 15 0 0 1 20 0" />
        <path d="M5 12.6a10 10 0 0 1 14 0" />
        <path d="M8.5 16.2a5 5 0 0 1 7 0" />
        <circle cx="12" cy="19.6" r="0.9" fill="currentColor" />
        <path d="M3 3l18 18" />
      </svg>
      <h1 id="title">No Connection</h1>
      <p id="message">TrendLIX People needs the internet. Check that Wi-Fi or mobile data is on, then try again.</p>
      <button id="retry" type="button">Retry</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      (function () {
        var SITE = 'https://people.trendlix.com';
        var START = SITE + '/app';
        var title = document.getElementById('title');
        var message = document.getElementById('message');
        var retry = document.getElementById('retry');
        var status = document.getElementById('status');
        var trying = false;

        function describe() {
          if (navigator.onLine === false) {
            title.textContent = 'No Connection';
            message.textContent =
              'TrendLIX People needs the internet. Check that Wi-Fi or mobile data is on, then try again.';
          } else {
            title.textContent = "Can't Reach TrendLIX People";
            message.textContent =
              "The system didn't answer. Try again in a moment; if it keeps happening, tell HR.";
          }
        }

        function tryAgain() {
          if (trying) return;
          if (navigator.onLine === false) {
            describe();
            status.textContent = 'Still no connection.';
            return;
          }
          trying = true;
          retry.disabled = true;
          status.textContent = 'Trying again…';
          var controller = typeof AbortController === 'function' ? new AbortController() : null;
          var timer = setTimeout(function () {
            if (controller) controller.abort();
          }, 10000);
          // an opaque answer is enough: it only shows the site can be reached
          fetch(START, { mode: 'no-cors', cache: 'no-store', signal: controller ? controller.signal : undefined })
            .then(function () {
              clearTimeout(timer);
              window.location.replace(START);
            })
            .catch(function () {
              clearTimeout(timer);
              trying = false;
              retry.disabled = false;
              describe();
              status.textContent = "Still can't reach it. Try again in a moment.";
            });
        }

        describe();
        retry.addEventListener('click', tryAgain);
        window.addEventListener('online', tryAgain);
        window.addEventListener('offline', function () {
          describe();
          status.textContent = '';
        });
      })();
    </script>
  </body>
</html>
