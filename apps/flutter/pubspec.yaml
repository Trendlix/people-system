name: people
description: "Trendlix People, the employee app"
publish_to: 'none'
version: 0.6.8+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 2.0.0
  device_info_plus: 13.3.0
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  geolocator: 14.1.1
  go_router: 18.1.0
  http: 1.6.0
  image_picker: 1.2.4
  local_auth: 3.0.2
  url_launcher: 6.3.3
  # the hourly location while checked in, in the background (owner, 1 November 2026: "Silent automatic ping")
  workmanager: 0.10.10
  # Google Play's own update check, for a Play build (owner, 6 November 2026: "now i have google play console")
  in_app_update: 4.2.5
  # push notifications (owner, 8 November 2026: "notifications are not working correctly, and when there is a pending
  # request make it to popup in the mobile app and gives a push notification once requested"): Firebase Cloud Messaging,
  # the project the API sends through (lib/platform/push.dart)
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The owner's design (Figma "PeopleTrendlix", 30 October 2026): the TrendLIX wordmark from it, and its font,
  # Instrument Sans (SIL Open Font License, assets/fonts/OFL.txt), cut from Google Fonts' variable font to the weights
  # used.
  assets:
    - assets/brand/
    - assets/fonts/OFL.txt

  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
