# People System's backend on the Hostinger VPS it shares with Prime ERP (owner's decision, 14 October 2026: same
# server, its own port). Three containers: PostgreSQL, the API, and a daily backup of the database.
#
# None of them opens a port on the server. Prime ERP's Caddy already holds ports 80/443 and the HTTPS certificate of
# the server's name; it also listens on 8443 and passes https://<server>:8443 on to this API over the network "edge",
# which only Caddy and this API share. Prime ERP's database and API are not on it.
#
# Settings and keys come from the file .env beside this one (see .env.example). It is never put in the repository.
name: people-system

x-logs: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "5" }   # the logs do not fill the disk

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: people
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: people_system
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U people -d people_system"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [inside]      # reachable only by the API and the backup
    logging: *logs

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:                 # the stamp of the build, worked out by deploy.sh; built by hand without them, it is empty
        PEOPLE_COMMIT: ${PEOPLE_COMMIT:-}
        PEOPLE_COMMITTED: ${PEOPLE_COMMITTED:-}
    restart: unless-stopped
    init: true
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://people:${POSTGRES_PASSWORD}@db:5432/people_system?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      TZ: Africa/Cairo
    networks:
      inside: {}
      edge:
        aliases: [people-api]   # the name Prime ERP's Caddy sends https://<server>:8443 to
    logging: *logs

  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_healthy }   # the API creates the tables when it starts: a save made before that holds nothing
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks: [inside]
    logging: *logs

volumes:
  pgdata:

networks:
  inside:
  edge:
    name: edge
    external: true          # shared with Prime ERP's Caddy; deploy.sh creates it if it is not there yet
