# People System's backend on the Hostinger VPS (owner's decision, 14 October 2026: srv2055591.hstgr.cloud, port 8443).
# Six containers on a network of their own: PostgreSQL, the API, the OCR service that reads ID cards and scanned
# documents for the API, the PDF converter that turns filled Word documents into PDFs (job offers), Caddy for HTTPS,
# and a daily backup of the database.
#
# Only Caddy is reachable from outside, on port 8443. Ports 80 and 443 of this server belong to another system, so
# Caddy issues its certificate from a private authority of its own; see Caddyfile. Nothing here touches anything else
# on the server.
#
# Settings and keys come from the file .env beside this one (see .env.example). It is never put in the repository.
name: people-system

x-logs: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "5" }   # the logs do not fill the disk

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: people
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: people_system
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U people -d people_system"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [inside]      # reachable only by the API and the backup
    logging: *logs

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:                 # the stamp of the build, worked out by deploy.sh; built by hand without them, it is empty
        PEOPLE_COMMIT: ${PEOPLE_COMMIT:-}
        PEOPLE_COMMITTED: ${PEOPLE_COMMITTED:-}
    restart: unless-stopped
    init: true
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://people:${POSTGRES_PASSWORD}@db:5432/people_system?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      OCR_URL: http://ocr:8000   # not in depends_on: the API starts and works without it; only reading documents needs it
      PDF_URL: http://pdf:3000   # the same: without it, offers are sent as Word files
      # email through the company's provider: set up in the system (Organization → Email Settings, a Super Admin's);
      # these are only the fallback when that page is off or empty. With neither, nothing is emailed and HR sends
      # links by hand. See .env.example and DEPLOY.md.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # the key the website signs a check-in's address with (check-ins locked to the office network, 20 October 2026):
      # made by ./web-key.sh, the same value saved as WEB_KEY in Vercel. Without it the lock can't be switched on, and
      # no one is refused for its lack. See .env.example.
      WEB_KEY: ${WEB_KEY:-}
      # push notifications to the employee app (owner, 20 October 2026: "Push notifications: yes"; apps/mobile/README.md,
      # Phase 4): the Firebase project's service account. Without all three, push is off and notifications stay in the
      # inbox (the bell). See .env.example and DEPLOY.md.
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      TZ: Africa/Cairo
    networks: [inside]
    logging: *logs

  ocr:
    build: ../services/ocr  # PaddleOCR on the CPU; its models are inside the image (services/ocr/README.md)
    restart: unless-stopped
    init: true
    environment:
      OCR_THREADS: 2        # CPU threads for reading a page; the server's CPUs are shared with Prime ERP
      TZ: Africa/Cairo
    mem_limit: 2g           # it uses about 250 MB idle and up to 1.4 GB while reading; this stops it starving the server
    healthcheck:            # healthy once the models are loaded, seconds after the start; deploy.sh waits for it
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks: [inside]      # no port: only the API reaches it, as http://ocr:8000; ID photos never leave the server
    logging: *logs

  pdf:
    # Gotenberg's LibreOffice image with Microsoft's core fonts added (pdf/Dockerfile): POST /forms/libreoffice/convert
    # turns a .docx into a PDF. With Arial and Times New Roman (Arabic included) the templates keep their layout; a font
    # it still lacks is printed in the nearest one it has.
    build: ./pdf
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=60s", "--libreoffice-restart-after=20", "--log-level=warn"]
    environment:
      TZ: Africa/Cairo
    mem_limit: 1g           # LibreOffice uses a few hundred MB while converting; the server's memory is shared with Prime ERP
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [inside]      # no port: only the API reaches it, as http://pdf:3000; documents never leave the server
    logging: *logs

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8443:8443"         # the only port of People System on this server
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data    # the private authority and the certificate are kept here
      - caddy_config:/config
    networks: [inside]
    logging: *logs

  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_healthy }   # the API creates the tables when it starts: a save made before that holds nothing
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks: [inside]
    logging: *logs

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  inside:
